<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>同频 · 评论区话术生成器</title>
  <style>
    :root {
      --bg: #0b0a09;
      --panel: #161310;
      --panel-2: #1c1815;
      --ink: #f7f1e6;
      --ink-soft: #e2dacc;
      --muted: #aba295;
      --line: rgba(244, 236, 223, 0.16);
      --accent: #ff6a4d;
      --green: #8fd3a4;
      --warning: #e6b77d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 28px 20px 72px;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 1.65;
    }
    .wrap { max-width: 900px; margin: 0 auto; }
    h1 { margin: 0 0 6px; font-size: 21px; font-weight: 600; }
    .lead { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
    .lead b { color: var(--green); font-weight: 600; }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      margin-bottom: 14px;
    }
    label { display: block; }
    label span {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 12px;
    }
    select, button { font-family: inherit; font-size: 13.5px; }
    select {
      width: 100%;
      height: 38px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--panel-2);
      color: var(--ink);
      cursor: pointer;
    }
    select:focus { outline: none; border-color: rgba(255, 138, 107, 0.6); }

    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
    .btn {
      height: 40px;
      padding: 0 18px;
      border-radius: 7px;
      cursor: pointer;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--ink-soft);
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }
    .btn:hover { color: var(--ink); border-color: rgba(244, 236, 223, 0.34); }
    .btn.primary {
      border-color: rgba(255, 138, 107, 0.55);
      background: linear-gradient(135deg, rgba(255, 126, 97, 0.95), rgba(234, 84, 55, 0.95));
      color: #1d0e08;
      font-weight: 600;
    }
    .btn.primary:hover { filter: brightness(1.05); }

    .result { display: flex; flex-direction: column; gap: 12px; }
    .card {
      position: relative;
      padding: 16px 18px 44px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
    }
    .card .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 11.5px;
      letter-spacing: 0.04em;
    }
    .card .meta b { color: var(--green); font-weight: 600; }
    .card p { margin: 0; white-space: pre-wrap; font-size: 14px; line-height: 1.75; }
    .copy {
      position: absolute;
      right: 14px;
      bottom: 12px;
      height: 28px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
    }
    .copy:hover { color: var(--ink); border-color: var(--line-strong); }
    .copy.done { color: var(--green); border-color: rgba(143, 211, 164, 0.5); }

    .rules {
      margin-top: 26px;
      padding: 16px 18px;
      border-left: 2px solid rgba(230, 183, 125, 0.6);
      background: rgba(230, 183, 125, 0.05);
      border-radius: 0 8px 8px 0;
    }
    .rules h2 { margin: 0 0 10px; font-size: 13.5px; color: var(--warning); font-weight: 600; }
    .rules ul { margin: 0; padding-left: 18px; color: var(--ink-soft); font-size: 13px; }
    .rules li { margin-bottom: 6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>评论区话术生成器</h1>
    <p class="lead">
      核心是<b>老实承认「我做了个网站」</b>——不装路人、不编故事。
      每次生成 10 条不同版本，挑顺眼的复制，改一两个字再发。
    </p>

    <div class="controls">
      <label>
        <span>帖子场景</span>
        <select id="scene">
          <option value="screenShare">屏幕共享画质糊 / 卡顿</option>
          <option value="howTo">异地恋怎么一起看电影</option>
          <option value="bilibili">想同步看 B站 / 追番</option>
          <option value="series">一起追剧、看综艺</option>
          <option value="gift">异地恋仪式感、送什么</option>
          <option value="tool">求推荐工具 / App</option>
        </select>
      </label>
      <label>
        <span>说法风格</span>
        <select id="style">
          <option value="direct">直接说明（最常用）</option>
          <option value="brief">极简一句</option>
          <option value="story">顺带讲讲为什么做</option>
          <option value="feedback">求人试用提意见</option>
        </select>
      </label>
      <label>
        <span>平台排版</span>
        <select id="platform">
          <option value="xhs">小红书（短段）</option>
          <option value="bili">B站（整段）</option>
          <option value="douban">豆瓣（整段）</option>
          <option value="tieba">贴吧（口语）</option>
        </select>
      </label>
      <label>
        <span>诚实程度</span>
        <select id="honesty">
          <option value="full">全部明说是我做的</option>
          <option value="soft">轻描淡写带一句</option>
        </select>
      </label>
    </div>

    <div class="actions">
      <button class="btn primary" id="generate">生成 10 条</button>
    </div>

    <div class="result" id="result"></div>

    <div class="rules">
      <h2>发之前</h2>
      <ul>
        <li><b>只在真的相关的帖子下回。</b>见帖就发，账号会被举报。</li>
        <li><b>每条改一两个字。</b>一字不改复制超过 3 次会被识别成机器。</li>
        <li><b>一天不超过 10 条。</b>新号 5 条以内。</li>
        <li><b>承认缺点。</b>「只有 720p」「只能两个人」——说出来反而更可信。</li>
        <li><b>被追问就老实答。</b>别绕，你是作者这件事藏不住。</li>
      </ul>
    </div>
  </div>

  <script>
  (function () {
    'use strict';

    var LINK = 'samehz.onrender.com';

    /* 自曝句：每条都必须包含「我做了 / 我写的」这类诚实声明 */
    var CONFESS = {
      direct: [
        '我自己做了个网站，免费，就是干这个的。',
        '这个我写了个网页工具，不收费。',
        '我做了个免费的小网站解决这件事。',
        '说个自荐的：我自己写了个网站，专门做这个。',
        '我建了个网页，免费的，功能就一个。',
        '正好我在做这个，已经上线了，免费。',
        '这事我做了个工具，网页的，不要钱。',
        '我自己折腾了一个网站，专门用来同步看电影。',
        '先说结论：我做了个免费的网站。',
        '我写了个小站，就是为这个场景做的。'
      ],
      brief: [
        '我做了个免费网页就是干这个的。',
        '有个我写的小站可以直接用。',
        '我弄了个网页，免费，专治这个。',
        '我做的，免费，搜一下就有。',
        '我自己写了个，不用装东西。',
        '我这边有个现成的，免费。'
      ],
      story: [
        '异地这两年一直没找到顺手的方案，最后自己写了个网站。',
        '实在受不了屏幕共享的画质，周末自己写了个网页。',
        '找了一圈没有合适的，干脆自己做了个网站。',
        '这东西是我自己做的，起因就是我们俩吵过一次「你又剧透了」。',
        '因为不想每次都折腾半小时，我写了个网站。',
        '本来只想自己用，写完觉得可能有别人需要，就放出来了。',
        '做这个的起因很蠢：我们为了「谁先按播放」生过气。',
        '我本职是写代码的，顺手做了个网站给自己用。'
      ],
      feedback: [
        '我做了个免费的小网站，功能很窄，想找人试试提提意见。',
        '刚做完一个网页工具，不知道对别人有没有用，来问问。',
        '自己写了个小站，想请几对异地的朋友帮忙试用一下。',
        '做了个东西，只有我一个人用有点浪费，来看看有没有人需要。',
        '厚着脸皮自荐一下，我做的，想收集点反馈。',
        '有人愿意帮我试试吗？我自己做的免费网站。'
      ],
      soft: [
        '顺便说一句，我自己做了个免费的小网站。',
        '最后提一下，我写了个网页，免费。',
        '另外我自己做了个工具，不收费，可以试试。',
        '补一句，这个场景我自己做了个网站。',
        '对了，我自己写了个，免费。'
      ]
    };

    /* 痛点句：先接住楼主的处境 */
    var PAIN = {
      screenShare: [
        '屏幕共享的问题是压缩，画质糊，声音还经常卡。',
        '共享出来对方那边是压缩画面，看两小时眼睛很累。',
        '两个人网速不一样的时候，慢的那个一直拖着快的。',
        '共享还特别吃 CPU，我这边风扇转得像起飞。',
        ''
      ],
      howTo: [
        '异地一起看电影最麻烦的是「同时」。',
        '每次都要掐着秒表按播放，差几秒就有人剧透。',
        '一边打电话一边看，最后电影没看成光聊天了。',
        '想找一部两个人都想看的，比同步还难。',
        ''
      ],
      bilibili: [
        'B站没法共享播放进度，两个人进度永远差一点。',
        '追番的时候最怕对方提前看完。',
        '想一起看但找不到顺手的办法。',
        ''
      ],
      series: [
        '追剧最难的是「你看到第几集」。',
        '日更的剧，第二天就有人忍不住剧透。',
        '两个人节奏不一样，最后只能各看各的。',
        ''
      ],
      gift: [
        '异地最缺的不是礼物，是「同时在场」。',
        '送东西送多了也没意思，不如固定做一件事。',
        '仪式感这东西，靠的是坚持不是花钱。',
        ''
      ],
      tool: [
        '试过好几个，要么太重要么收费。',
        '市面上大多是要装客户端的，嫌麻烦。',
        '找了一圈，没找到只做「同步进度」的。',
        ''
      ]
    };

    /* 做法句：说清楚这个网站干什么 */
    var HOW = {
      screenShare: [
        '两个人在各自设备放同一部电影，只同步「播到第几秒」，画质是原片。',
        '不传视频，只传进度。所以不压缩，也不吃带宽。',
        '谁按暂停另一边也停，拖进度也是同步的。',
        '偏差超过 0.85 秒会自动拉回来，不用手动对。',
        '它不存片也不传片，你手里是什么画质就是什么画质。'
      ],
      howTo: [
        '思路是各自放自己的文件，中间只同步一个时间戳。',
        '两个人打开同一部片子，进度互相同步。',
        '不用共享画面，也不用同时按播放键。',
        '每 3 秒自动核对一次，误差基本在 0.0x 秒。',
        '支持本地文件，也能贴链接（B站、YouTube、mp4）。'
      ],
      bilibili: [
        '现在贴 B站链接也能同步，两边进度一致。',
        'B站视频不用下载，贴上去两边都能放。',
        '它会把链接解析成能直接播的地址，两边各自加载。',
        '追番的话贴同一个链接就行。'
      ],
      series: [
        '进度是共用的，谁看到第几集一目了然。',
        '一集二十分钟，看完各自睡，第二天接着看。',
        '约好一次只看同一集，谁先偷看谁请奶茶。',
        '综艺短剧也能用，不用两个人对着喊「你准备好了吗」。'
      ],
      gift: [
        '我们现在的固定日程是每周三晚上十一点半，雷打不动。',
        '把电影夜做成日程，比突发的惊喜更持久。',
        '用这个小站开场，省掉了「你准备好了吗」的来回。',
        '仪式感其实是「说好一起做」然后真的做到。'
      ],
      tool: [
        '它只干一件事：让两个人的进度一致。',
        '浏览器打开就能用，不用注册。',
        '没有花哨功能，所以也不卡。',
        '免费，也没广告弹窗。'
      ]
    };

    /* 结尾：承认局限 + 给路径 */
    var CLOSER = {
      direct: [
        '搜 samehz 就能找到，免费。',
        '地址是 ' + LINK + '，直接打开就行。',
        '名字叫同频，搜 samehz 也有。',
        '有需要可以试试，不合适就当我没说。',
        '搜「同频」应该能找到。',
        '免费用的，也没打算收费。'
      ],
      humble: [
        '功能很简陋，只有两个人能进，但够用。',
        '清晰度看片源，B站链接的话是 720p，别期待太高。',
        '不是商业产品，就是我自己在维护。',
        '做得很粗糙，能用就行。',
        '没什么技术含量，胜在简单。'
      ],
      soft: [
        '',
        '',
        '你们也可以试试类似的做法。',
        '反正核心就是别传画面，只传进度。'
      ]
    };

    var EMOJI = {
      xhs: ['', '', '🥲', '', '🎬', ''],
      bili: ['', '', '', '', '', ''],
      douban: ['', '', '', '', '', ''],
      tieba: ['', '', '', '', '', '']
    };

    function pickUnique(list, used) {
      var pool = list.filter(function (item) { return used.indexOf(item) === -1; });
      if (!pool.length) pool = list.slice();
      var value = pool[Math.floor(Math.random() * pool.length)];
      used.push(value);
      return value;
    }

    function shape(platform, text) {
      if (platform === 'xhs') {
        return text
          .replace(/。([^。\n])/g, '。\n$1')
          .replace(/，([^，\n]{6,})/g, '，\n$1')
          .replace(/\n{2,}/g, '\n')
          .replace(/\n$/, '');
      }
      if (platform === 'tieba') {
        return text.replace(/\n/g, ' ');
      }
      return text;
    }

    function buildOne(scene, style, platform, honesty, used) {
      var confessPool = honesty === 'soft' ? CONFESS.soft : CONFESS[style];
      var confess = pickUnique(confessPool, used.confess);
      var pain = pickUnique(PAIN[scene], used.pain);
      var how = pickUnique(HOW[scene], used.how);
      var closerKey = Math.random() < 0.62 ? 'direct' : 'humble';
      if (honesty === 'soft' && Math.random() < 0.5) closerKey = 'soft';
      var closer = pickUnique(CLOSER[closerKey], used.closer);
      var emoji = pickUnique(EMOJI[platform] || [''], []);

      var parts = [pain, confess, how, closer].filter(function (part) { return part; });
      var text = parts.join('');
      return shape(platform, text) + emoji;
    }

    function generate() {
      var scene = document.getElementById('scene').value;
      var style = document.getElementById('style').value;
      var platform = document.getElementById('platform').value;
      var honesty = document.getElementById('honesty').value;

      var used = { confess: [], pain: [], how: [], closer: [] };
      var items = [];
      var guard = 0;
      while (items.length < 10 && guard < 200) {
        guard += 1;
        var text = buildOne(scene, style, platform, honesty, used);
        if (items.indexOf(text) === -1) items.push(text);
      }

      var result = document.getElementById('result');
      result.replaceChildren.apply(result, items.map(function (text, index) {
        var card = document.createElement('div');
        card.className = 'card';

        var meta = document.createElement('div');
        meta.className = 'meta';
        var label = document.createElement('span');
        label.textContent = '版本 ' + (index + 1);
        var length = document.createElement('b');
        length.textContent = text.length + ' 字';
        meta.appendChild(label);
        meta.appendChild(length);

        var paragraph = document.createElement('p');
        paragraph.textContent = text;

        var button = document.createElement('button');
        button.className = 'copy';
        button.type = 'button';
        button.textContent = '复制';
        button.addEventListener('click', function () {
          copy(text).then(function (ok) {
            button.textContent = ok ? '已复制' : '复制失败';
            button.classList.toggle('done', ok);
            setTimeout(function () {
              button.textContent = '复制';
              button.classList.remove('done');
            }, 1800);
          });
        });

        card.appendChild(meta);
        card.appendChild(paragraph);
        card.appendChild(button);
        return card;
      }));
    }

    function copy(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text).then(function () { return true; }).catch(function () { return legacy(text); });
      }
      return Promise.resolve(legacy(text));
    }

    function legacy(text) {
      try {
        var area = document.createElement('textarea');
        area.value = text;
        area.style.position = 'fixed';
        area.style.opacity = '0';
        document.body.appendChild(area);
        area.select();
        var ok = document.execCommand('copy');
        area.remove();
        return ok;
      } catch (e) {
        return false;
      }
    }

    document.getElementById('generate').addEventListener('click', generate);
    generate();
  })();
  </script>
</body>
</html>
